<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMANO HOUSE — Atur Ulang Kata Sandi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="container nav-container flex-center">
    <a href="index.html" class="color-name nav-brand">MAMANO HOUSE</a>
  </nav>

  <main class="container mt-lg mb-lg">
    <div class="card p-md">
      <h2 class="section-title text-center mb-xs">
        Buat Kata Sandi Baru
      </h2>

      <p class="text-sm text-muted text-center mb-md">
        Masukkan kata sandi baru untuk akun MAMANO HOUSE kamu.
      </p>

      <form id="form-reset-password" class="flex-column gap-sm">

        <div class="flex-column gap-xs">
          <label for="reset-password"
                 class="text-xs font-bold text-green">
            Kata Sandi Baru
          </label>

          <input
            type="password"
            id="reset-password"
            required
            minlength="8"
            placeholder="Minimal 8 karakter"
            class="p-xs radius-sm border-dashed w-100">
        </div>

        <div class="flex-column gap-xs">
          <label for="reset-password-confirm"
                 class="text-xs font-bold text-green">
            Konfirmasi Kata Sandi
          </label>

          <input
            type="password"
            id="reset-password-confirm"
            required
            minlength="8"
            placeholder="Ulangi kata sandi baru"
            class="p-xs radius-sm border-dashed w-100">
        </div>

        <div
          id="reset-error"
          class="text-xs btn-danger p-xs radius-sm text-center hide-element">
        </div>

        <div
          id="reset-success"
          class="text-xs p-xs radius-sm text-center hide-element">
        </div>

        <button
          type="submit"
          id="btn-reset-submit"
          class="btn btn-gold w-100 mt-sm">
          Simpan Kata Sandi
        </button>

      </form>

      <p class="text-center text-xs text-muted mt-md">
        Ingat kata sandimu?
        <a href="login.html"
           class="text-green font-bold no-underline">
          Kembali ke Login
        </a>
      </p>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
